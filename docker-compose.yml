version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartstudy_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install && pnpm --dir apps/api dev"
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      CORS_ORIGIN: http://localhost:5173
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smartstudy_ai?schema=public
      AUTH_SECRET: dev-auth-secret-change-me-please-1234
      AUTH_COOKIE_NAME: smartstudy_session
    depends_on:
      - postgres
    volumes:
      - .:/app

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install && pnpm --dir apps/web dev --host 0.0.0.0"
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    volumes:
      - .:/app

volumes:
  postgres_data:
